<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aplify">
  <title>Aplify</title>
  <!-- Small-size cut of the Aplify mark: the wordmark's "i", reduced to its
       two axis-aligned rectangles — white stem, cyan square dot — on the
       brand's black ground. The dot is the identity at this size. -->
  <rect width="64" height="64" rx="12" fill="#000000"/>
  <rect x="27" y="10" width="10" height="8" fill="#02dafd"/>
  <rect x="27" y="24" width="10" height="30" fill="#ffffff"/>
</svg>
